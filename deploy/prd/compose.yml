# Production stack. Each service pins the image published for the commit it runs.
# Persistent data lives under /srv/web-search/data so that a host move copies one directory.
name: web-search-prd

services:
  caddy:
    image: ghcr.io/tomato414941/web-search/caddy:c7364c791a1a5b7fafa88715b02258e74c88c59c@sha256:c48c29fa29232d1412d914c31cee3a8a21d47e6466beb2d2d1005bca220d42b0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/web-search/data/caddy/data:/data
      - /srv/web-search/data/caddy/config:/config
    depends_on:
      frontend:
        condition: service_started

  postgres:
    image: postgres:16.14
    restart: unless-stopped
    shm_size: "256m"
    command:
      [
        "postgres",
        "-c",
        "max_connections=${POSTGRES_MAX_CONNECTIONS:-64}",
        "-c",
        "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}",
        "-c",
        "work_mem=${POSTGRES_WORK_MEM:-4MB}",
      ]
    environment:
      POSTGRES_USER: websearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: websearch
    volumes:
      - /srv/web-search/data/postgres:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websearch"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    image: ghcr.io/tomato414941/web-search/frontend:1cc0cb7fec3e6bf23eda400e577f922899e20527
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://websearch:${POSTGRES_PASSWORD}@postgres:5432/websearch
    command: ["python", "-c", "from web_search_postgres.migrate import migrate; migrate()"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/tomato414941/web-search/frontend:cb075e96f6b94c695b61b7709d0605a171a146dd
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://websearch:${POSTGRES_PASSWORD}@postgres:5432/websearch
      - ALLOWED_HOSTS=${ALLOWED_HOSTS},frontend,localhost,127.0.0.1
      - ANALYTICS_SALT=${ANALYTICS_SALT}
      - CRAWLER_SERVICE_URL=http://crawler:8000
      - INDEXER_API_KEY=${INDEXER_API_KEY}
      - DB_POOL_MIN=${DB_POOL_MIN_FRONTEND:-1}
      - DB_POOL_MAX=${DB_POOL_MAX_FRONTEND:-4}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - OPENSEARCH_INDEX_NAME=${OPENSEARCH_INDEX_NAME:-documents}
      - OPENSEARCH_ENABLED=${OPENSEARCH_ENABLED:-false}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    mem_limit: ${FRONTEND_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  indexer:
    image: ghcr.io/tomato414941/web-search/indexer:cb075e96f6b94c695b61b7709d0605a171a146dd
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://websearch:${POSTGRES_PASSWORD}@postgres:5432/websearch
      - INDEXER_API_KEY=${INDEXER_API_KEY}
      - DB_POOL_MIN=${DB_POOL_MIN_INDEXER:-1}
      - DB_POOL_MAX=${DB_POOL_MAX_INDEXER:-6}
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - OPENSEARCH_INDEX_NAME=${OPENSEARCH_INDEX_NAME:-documents}
      - OPENSEARCH_ENABLED=${OPENSEARCH_ENABLED:-false}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    mem_limit: ${INDEXER_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  crawler:
    image: ghcr.io/tomato414941/web-search/crawler:1cc0cb7fec3e6bf23eda400e577f922899e20527
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://websearch:${POSTGRES_PASSWORD}@postgres:5432/websearch
      - INDEXER_API_URL=http://indexer:8000/documents
      - INDEXER_API_KEY=${INDEXER_API_KEY}
      - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY_CRAWLER:-2}
      - DB_POOL_MIN=${DB_POOL_MIN_CRAWLER:-1}
      - DB_POOL_MAX=${DB_POOL_MAX_CRAWLER:-4}
      - DB_EXECUTOR_MAX=${DB_EXECUTOR_MAX_CRAWLER:-6}
      - LINK_ARCHIVE_MAX_PENDING_BYTES=${LINK_ARCHIVE_MAX_PENDING_BYTES:-536870912}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      link-archive:
        condition: service_healthy
    mem_limit: ${CRAWLER_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  link-archive:
    image: ghcr.io/tomato414941/web-search/link-archive:1cc0cb7fec3e6bf23eda400e577f922899e20527
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://websearch:${POSTGRES_PASSWORD}@postgres:5432/websearch
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_REGION=${R2_REGION:-auto}
      - DB_POOL_MIN=1
      - DB_POOL_MAX=2
    command: ["web-search-link-archive", "run"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    mem_limit: ${LINK_ARCHIVE_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "web-search-link-archive", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - /srv/web-search/data/opensearch:/usr/share/opensearch/data
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  search-projection-rebuild:
    image: ghcr.io/tomato414941/web-search/indexer:cb075e96f6b94c695b61b7709d0605a171a146dd
    restart: "no"
    profiles: ["search-projection-rebuild"]
    environment:
      - DATABASE_URL=postgresql://websearch:${POSTGRES_PASSWORD}@postgres:5432/websearch
      - OPENSEARCH_URL=${OPENSEARCH_URL:-http://opensearch:9200}
      - OPENSEARCH_INDEX_NAME=${OPENSEARCH_INDEX_NAME:-documents}
    command: ["python", "-m", "web_search_indexer.cli.rebuild_search_projection"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  prometheus:
    image: ghcr.io/tomato414941/web-search/prometheus:cb075e96f6b94c695b61b7709d0605a171a146dd
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/config.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"
    volumes:
      - /srv/web-search/data/prometheus:/prometheus
    depends_on:
      frontend:
        condition: service_started
      indexer:
        condition: service_started
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  grafana:
    image: ghcr.io/tomato414941/web-search/grafana:c7364c791a1a5b7fafa88715b02258e74c88c59c@sha256:07b138e8abaccaec06d506b4dfdcb0957c13a88a508a50b744e0dcd72c420538
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/web-search-overview.json
    volumes:
      - /srv/web-search/data/grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
