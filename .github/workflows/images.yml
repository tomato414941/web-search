name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to publish images for
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: caddy
            context: deploy/caddy
            dockerfile: deploy/caddy/Dockerfile
          - service: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile
          - service: indexer
            context: .
            dockerfile: apps/indexer/Dockerfile
          - service: crawler
            context: .
            dockerfile: apps/crawler/Dockerfile
          - service: link-archive
            context: .
            dockerfile: packages/web-model/Dockerfile
          - service: prometheus
            context: deploy/monitoring/prometheus
            dockerfile: deploy/monitoring/prometheus/Dockerfile
          - service: grafana
            context: deploy/monitoring/grafana
            dockerfile: deploy/monitoring/grafana/Dockerfile
          - service: opensearch
            context: deploy/opensearch
            dockerfile: deploy/opensearch/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve the source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Older commits do not have every image; skip the ones they lack.
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.source.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.source.outputs.present == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.source.outputs.present == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/web-search/${{ matrix.service }}:${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
